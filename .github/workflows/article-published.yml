name: Article Published

# Fires when a "Daily Article" review PR (branch content/<slug>, opened by
# .github/workflows/daily-article.yml) is merged — i.e. the moment a human
# actually approves an AI-written draft for publication, not when it was
# generated. Waits for the merge to go live on Vercel, then sends the push
# notification that daily-article.yml used to send immediately after
# generating (back when it pushed straight to main with no review step).
#
# Closing the PR instead of merging it is a silent discard — no notification,
# nothing further happens here.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  notify:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'content/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the published article's slug and title
        id: article
        run: |
          SLUG="${GITHUB_HEAD_REF#content/}"
          FILE="src/content/articles/$SLUG.md"
          if [ ! -f "$FILE" ]; then
            echo "✗ expected $FILE on main after merge, not found — skipping notification."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TITLE=$(grep -m1 '^title:' "$FILE" | sed 's/^title:[[:space:]]*//')
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}

      - name: Wait for the new article to be live, then notify subscribers
        if: steps.article.outputs.found == 'true'
        env:
          SLUG: ${{ steps.article.outputs.slug }}
          TITLE: ${{ steps.article.outputs.title }}
        run: |
          URL="https://www.sothikbanglacalendar.live/articles/$SLUG"
          echo "waiting for $URL to deploy..."
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$CODE" = "200" ]; then echo "live after $((i * 10))s"; break; fi
            sleep 10
          done
          curl -fsS -G "https://www.sothikbanglacalendar.live/api/send-push" \
            --retry 3 --retry-delay 20 --retry-connrefused \
            --data-urlencode "slot=article" \
            --data-urlencode "slug=$SLUG" \
            --data-urlencode "title=$TITLE" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" -X POST -w "\nHTTP %{http_code}\n"
