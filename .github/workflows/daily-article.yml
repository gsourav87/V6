name: Daily Article

# One new "বাংলার ঐতিহ্য ও ইতিহাস" article a day — topic popped from
# content-queue/article-topics.txt, written by Gemini, auto-interlinked
# against real site data, featured image from Pexels (free license).
#
# Setup (one time): repo Settings → Secrets and variables → Actions → add
#   GEMINI_API_KEY (required) and PEXELS_API_KEY (optional — publishes
#   without a featured image if omitted).
#
# Pushes using the workflow's own built-in GITHUB_TOKEN — no personal
# access token needed, unlike the git push in the docs elsewhere.
#
# After a successful publish, waits for the new page to actually be live on
# Vercel, then sends a push notification via the existing api/send-push.ts
# (same CRON_SECRET the daily panchang pushes use).
#
# Runs twice: 08:00 IST, then a retry at 08:40 IST in case the first run hit
# a transient failure (Gemini rate limit, network blip, etc.). The retry is
# a no-op if the 08:00 run already succeeded — daily-article.ts checks for
# today's article before doing any work.
#
# Test on demand: Actions tab → "Daily Article" → Run workflow.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 2 * * *" # 08:00 IST
    - cron: "10 3 * * *" # 08:40 IST — retry if the 08:00 run failed

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Generate article
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: npx tsx scripts/daily-article.ts

      - name: Commit and push if a new article was written
        run: |
          git config user.name "sothik-bangla-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add content-queue/article-topics.txt src/content/articles public/articles
            git commit -m "content: new article ($(date -u +%F))"
            git push
          else
            echo "nothing to commit"
          fi

      - name: Wait for the new article to be live, then notify subscribers
        if: steps.generate.outputs.slug != ''
        env:
          SLUG: ${{ steps.generate.outputs.slug }}
          TITLE: ${{ steps.generate.outputs.title }}
        run: |
          URL="https://www.sothikbanglacalendar.live/articles/$SLUG"
          echo "waiting for $URL to deploy..."
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$CODE" = "200" ]; then echo "live after $((i * 10))s"; break; fi
            sleep 10
          done
          curl -fsS -G "https://www.sothikbanglacalendar.live/api/send-push" \
            --data-urlencode "slot=article" \
            --data-urlencode "slug=$SLUG" \
            --data-urlencode "title=$TITLE" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" -X POST -w "\nHTTP %{http_code}\n"
