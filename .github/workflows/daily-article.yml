name: Daily Article

# One new "বাংলার ঐতিহ্য ও ইতিহাস" article a day — topic popped from
# content-queue/article-topics.txt, written by Gemini, auto-interlinked
# against real site data, featured image from Pexels (free license).
#
# Setup (one time): repo Settings → Secrets and variables → Actions → add
#   GEMINI_API_KEY (required) and PEXELS_API_KEY (optional — publishes
#   without a featured image if omitted).
#
# This does NOT push straight to main. It opens a pull request instead, so a
# human skims the AI-written draft before it goes live — Google's spam
# policy on "scaled content abuse" specifically calls out AI content
# "published at scale" with no human review as the high-risk pattern, and
# auto-publishing daily with zero review was exactly that. Merging the PR is
# what actually publishes it; .github/workflows/article-published.yml picks
# up from there (waits for the live deploy, sends the push notification).
#
# Runs twice: 08:00 IST, then a retry at 08:40 IST in case the first run hit
# a transient failure (Gemini rate limit, network blip, etc.). The retry
# no-ops if the 08:00 run already opened a PR — see the first step below —
# and also no-ops once daily-article.ts sees today's article already merged.
#
# Test on demand: Actions tab → "Daily Article" → Run workflow.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 2 * * *" # 08:00 IST
    - cron: "10 3 * * *" # 08:40 IST — retry if the 08:00 run failed

permissions:
  contents: write
  pull-requests: write

# If the 08:00 run is somehow still going when the 08:40 retry fires, queue
# rather than race on the branch push — don't cancel a run that might succeed.
concurrency:
  group: daily-article
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if a content PR is already open
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Don't generate a second draft while yesterday's (or today's
          # earlier run's) is still waiting on review — that would burn an
          # extra queue topic and Gemini call for nothing, and pile up PRs
          # if review lags.
          open_count=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("content/"))] | length')
          if [ "$open_count" -gt 0 ]; then
            echo "↷ a content PR is already open — skipping this run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 20

      - run: npm ci
        if: steps.guard.outputs.skip != 'true'

      - name: Generate article
        id: generate
        if: steps.guard.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: npx tsx scripts/daily-article.ts

      - name: Open a review PR if a new article was written
        if: steps.guard.outputs.skip != 'true' && steps.generate.outputs.slug != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.generate.outputs.slug }}
          TITLE: ${{ steps.generate.outputs.title }}
        run: |
          git config user.name "sothik-bangla-bot"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="content/$SLUG"
          git checkout -b "$BRANCH"
          git add content-queue/article-topics.txt src/content/articles public/articles
          git commit -m "content: new article ($(date -u +%F)) — $TITLE"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "📝 নতুন নিবন্ধ: $TITLE" \
            --body "$(cat <<EOF
          AI-generated draft, ready for a quick read-through before it goes live.

          - **Slug:** \`$SLUG\`
          - **Preview after merge:** https://www.sothikbanglacalendar.live/articles/$SLUG

          Merging this PR is what publishes the article — merge once it reads
          right and the facts check out. Closing instead of merging discards it
          (the topic has already been popped from the queue either way).
          EOF
          )"
